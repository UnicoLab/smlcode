# golangci-lint v2 config (schema requires golangci-lint >= v2; verified
# against v2.5.0). See scripts/lint.sh / `make lint` / `make lint-strict`.
#
# Baseline: 0 issues.
#
# The 2026-08-23 baseline comment recorded 95, and a later re-measure read 36 —
# both were read through golangci-lint's DEFAULT output caps
# (max-issues-per-linter: 50, max-same-issues: 3), which hid most of a class
# once three of its members had been printed. The real total behind that filter
# was 133: 101 gosec (64 of them G304), 23 misspell, 5 errcheck, 3 staticcheck,
# 1 unused. `issues.max-*: 0` below is what makes the number honest, and is the
# reason this file can now claim zero.
#
# Getting there: G304 is excluded WITH A WRITTEN REASON (see below) because it
# is unactionable for a program whose purpose is reading files by computed
# path; everything else was fixed rather than silenced. The handful of
# remaining //nolint directives in the tree each name their linter and state
# why that specific site is a false positive.
#
# `make lint` and `make lint-strict` are both BLOCKING, and CI runs `make check`
# (which includes lint) with no continue-on-error. Keep it at zero: a new
# finding fails the build, which is the point.
#
# Linter notes:
#   - errcheck, staticcheck, unused, ineffassign, govet are golangci-lint v2
#     defaults (linters.default: standard) — not listed under enable below.
#   - gosimple/stylecheck have no separate v2 entry: both are folded into
#     the "staticcheck" linter's own rule set in v2.
version: "2"
run:
  tests: true
issues:
  # golangci-lint truncates by default (max-issues-per-linter: 50,
  # max-same-issues: 3). A ratchet measured through that filter is a lie: the
  # count read 36 while the real total was 133, because gosec alone had 64
  # G304 findings and only 3 were shown. Report everything.
  max-issues-per-linter: 0
  max-same-issues: 0
linters:
  enable:
    - bodyclose
    - gosec
    - misspell
  settings:
    gosec:
      excludes:
        # G104 (unhandled error) duplicates errcheck, which is on.
        - G104
        # G304 "potential file inclusion via variable" — 64 findings across 32
        # packages, and not one of them is actionable. slmcode's job is reading
        # files whose paths are computed: from the project root, from a
        # directory walk, from config, or from an agent's tool call. There is
        # no version of this program in which every os.ReadFile takes a
        # constant.
        #
        # The control that actually matters is the workspace jail —
        # Workspace.resolve + checkSymlinkEscape in pkg/workspace/tools.go,
        # which every agent-supplied path passes through before any read, and
        # which has its own hardening suite (pkg/workspace/tools_hardening_test.go,
        # guard_test.go). Annotating 64 sites with the same sentence would say
        # less than this comment does, and would rot faster.
        #
        # G301/G302/G306 (directory and file permissions) stay ENABLED: those
        # are actionable, and harness state under .slmcode is 0o750/0o600.
        - G304
    misspell:
      locale: US
  exclusions:
    generated: lax
    # No default exclusion presets: those blanket-suppress large classes of
    # errcheck/staticcheck findings (e.g. "common-false-positives",
    # "std-error-handling") — with them on, errcheck alone drops from 29
    # findings to 5. Ratchet against real findings, not a pre-filtered view.
    rules:
      # Test files get a pass from gosec: things it flags there (weak temp
      # perms, "hardcoded" fixture values, etc.) are routine in test code
      # and not a real security exposure.
      - linters:
          - gosec
        path: _test\.go
    paths:
      - third_party$
      - builtin$
      - examples$
formatters:
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
