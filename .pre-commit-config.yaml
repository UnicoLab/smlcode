# Local hooks for SLMCode. Install with: pre-commit install
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        exclude: ^(assets/|.*\.(png|jpg|jpeg|gif|webp|ico)$)
      - id: end-of-file-fixer
        exclude: ^(assets/|.*\.(png|jpg|jpeg|gif|webp|ico)$)
      - id: check-yaml
        args: [--allow-multiple-documents]
        exclude: ^(mkdocs\.yml|stacks/.*)$
      - id: check-added-large-files
        args: [--maxkb=1024]
      - id: check-merge-conflict
      - id: mixed-line-ending
        args: [--fix=lf]

  - repo: local
    hooks:
      - id: make-check
        name: make check
        description: >-
          Full local gate (gofmt, vet, golangci-lint, unit tests, race
          tests, web lint+build) — the same target CI runs, so local and CI
          cannot diverge.
        language: system
        entry: make check
        pass_filenames: false
        types_or: [go, javascript, jsx, tsx, ts, css, html, yaml]
