<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SLMCode Studio</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='6' fill='%237c3aed'/><text x='16' y='22' font-family='system-ui' font-weight='700' font-size='18' fill='white' text-anchor='middle'>SL</text></svg>" />
    <style>
      :root { color-scheme: light dark; }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, sans-serif;
        background: #0b0b12;
        color: #e6e6f0;
      }
      main {
        max-width: 34rem;
        padding: 2.5rem;
        text-align: center;
      }
      h1 { font-size: 1.4rem; margin-bottom: 0.5rem; }
      p { line-height: 1.5; color: #a3a3b8; }
      code {
        display: inline-block;
        margin-top: 1rem;
        padding: 0.5rem 0.9rem;
        border-radius: 0.4rem;
        background: #17171f;
        color: #7c3aed;
        font-family: "JetBrains Mono", ui-monospace, monospace;
      }
    </style>
  </head>
  <body class="antialiased">
    <div id="root">
      <main>
        <h1>SLMCode Studio UI not built</h1>
        <p>
          This is a placeholder page, checked in so <code>go build</code> always has something
          to embed. The real React Studio UI has not been built into this checkout yet.
        </p>
        <code>make bootstrap</code>
        <p>or, if you already have Node installed:</p>
        <code>make ui-react</code>
      </main>
    </div>
  </body>
</html>
