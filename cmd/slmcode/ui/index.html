<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SLMCode Studio</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230f6e8c'/%3E%3Ctext x='16' y='21' text-anchor='middle' font-family='system-ui' font-size='13' font-weight='700' fill='white'%3ES%3C/text%3E%3C/svg%3E" />
  <script>
    (function () {
      try {
        var t = localStorage.getItem("slmcode-theme");
        if (t !== "light" && t !== "dark") {
          t = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        }
        document.documentElement.setAttribute("data-theme", t);
      } catch (e) {
        document.documentElement.setAttribute("data-theme", "light");
      }
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <div id="root"></div>
  <script src="/vendor/react.production.min.js"></script>
  <script src="/vendor/react-dom.production.min.js"></script>
  <script src="/vendor/babel.min.js"></script>
  <script type="text/babel" src="/app.jsx"></script>
  <noscript>SLMCode Studio requires JavaScript.</noscript>
  <footer style="text-align:center;padding:0.5rem;font-size:0.75rem;position:fixed;bottom:0;width:100%;background:var(--bg);border-top:1px solid var(--line);z-index:5;display:flex;align-items:center;justify-content:center;gap:0.4rem;flex-wrap:wrap">
    <span style="color:var(--muted)">Made with</span>
    <span style="color:#e53e3e;font-size:1rem;animation:pulse 2s infinite">♥</span>
    <span style="color:var(--muted)">by</span>
    <a href="https://unicolab.ai" target="_blank" rel="noreferrer" style="color:var(--accent);text-decoration:none;font-weight:700">UnicoLab</a>
    <span style="color:var(--muted)">—</span>
    <span style="background:linear-gradient(135deg,#7c3aed,#3b82f6,#10b981);-webkit-background-clip:text;-webkit-text-fill-color:transparent;font-weight:700">AI & Innovation</span>
  </footer>
  <style>
    @keyframes pulse { 0%,100%{transform:scale(1)} 50%{transform:scale(1.25)} }
  </style>
</body>
</html>
