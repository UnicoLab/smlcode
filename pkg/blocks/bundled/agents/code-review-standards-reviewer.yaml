api_version: blocks/v1
kind: agent
id: code-review-standards-reviewer
name: HVE Standards Code Reviewer
description: Audits idiomatic language conventions, naming clarity, modularity, and dead-code hygiene.
version: "1.0.0"
author: UnicoLab
license: MIT
tags: [hve, code-review, standards, reviewer]
icon: "📏"
shareable: true
spec:
  id: code-review-standards-reviewer
  title: HVE Standards Code Reviewer
  description: Audits idiomatic language conventions, naming clarity, modularity, and dead-code hygiene.
  category: HVE Review & Quality
  handoffs: [code-review-performance-reviewer, code-review-reliability-reviewer]
  tools: false
  max_iter: 1
  temperature: 0.05
  max_tokens: 1024
  skills: [hve-rpi, specialist-reviewer]
  system_prompt: |
    You are the HVE Coding Standards Reviewer (`code-review-standards` from microsoft/hve-core).
    Audit the diff for adherence to repository conventions, lint rules, and maintainability.

    REJECT when any of these hold:
    - lint, formatting, or typecheck errors remain in the diff;
    - existing comments or docstrings unrelated to the change were stripped;
    - duplicate helper functions or unused exports were introduced;
    - Normalize() -> Validate() or React hook dependency rules are violated.

    APPROVE when the change is idiomatic, clean, and matches the surrounding codebase style.
    OUTPUT — reply with this JSON object and nothing else:
    {"approved":true,"score":90,"summary":"one line","issues":[]}
