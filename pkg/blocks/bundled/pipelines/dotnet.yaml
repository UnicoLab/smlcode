api_version: blocks/v1
kind: pipeline
id: dotnet
name: C# / .NET Engineering Pipeline
description: >-
  SLMCode pipeline tuned for .NET — dotnet build/test/format gates with a
  C#-aware worker, tester and reviewer.
version: "1.0.0"
author: UnicoLab
license: MIT
language: csharp
tags: [csharp, dotnet, msbuild, pipeline]
icon: "🟣"
shareable: true
spec:
  version: 1
  order:
    - init
    - skills
    - context
    - explore
    - docs
    - architect
    - clarify
    - plan
    - split
    - coord
    - execute
    - learn
    - polish
    - test
    - memory
    - done
  groups:
    - id: prepare
      label: Prepare
      steps: [init, skills, context, explore, docs]
    - id: design
      label: Design
      steps: [architect, clarify, plan, split]
    - id: build
      label: Build
      steps: [coord, execute, learn]
    - id: verify
      label: Verify
      steps: [polish, test]
    - id: finish
      label: Finish
      steps: [memory, done]
  phases:
    init: {agent: "", when: always, label: Init, tip: Boot workspace + session, group: prepare}
    skills: {agent: "", when: always, label: Skills, tip: Load skills & knowledge packs, group: prepare}
    context: {agent: context, when: always, label: Context, tip: Refresh CONTEXT / project memory, group: prepare}
    explore: {agent: explorer, when: auto, label: Explore, tip: Map projects, namespaces & the solution, group: prepare}
    docs: {agent: docs, when: auto, label: Docs, tip: Read README, .csproj and Directory.Build props, group: prepare}
    architect: {agent: architect, when: auto, label: Architect, tip: Shape namespaces, interfaces & DI wiring, group: design}
    clarify: {agent: "", when: auto, label: Clarify, tip: Lock PRD / ask decisions, group: design}
    plan: {agent: planner, when: always, label: Plan, tip: Write the execution plan, group: design}
    split: {agent: splitter, when: always, label: Split, tip: Break into atomic tasks, group: design}
    coord: {agent: coordinator, when: always, label: Coord, tip: Coordinate board & focus, group: build}
    execute: {agent: dotnet-worker, when: always, label: Execute, tip: Workers implement + review, group: build}
    learn: {agent: memory, when: auto, label: Learn, tip: Capture lessons mid-run, group: build}
    polish: {agent: placeholder, when: always, label: Polish, tip: Fill placeholders / flag gaps, group: verify}
    test: {agent: dotnet-tester, when: always, label: Test, tip: dotnet build + dotnet test, group: verify}
    memory: {agent: memory, when: always, label: Memory, tip: Distill long-term memory, group: finish}
    done: {agent: "", when: always, label: Done, tip: Run complete, group: finish}
  execute:
    default_role: dotnet-worker
    reviewer: dotnet-reviewer
    corrector: corrector
    max_waves: 2
  slots:
    - id: dotnet-quality-gate
      agent: dotnet-tester
      title: C# / .NET quality reminder
      before: execute
      when: always
      persist_to: scratch
      fail_mode: continue
      input: |
        Before implementing, remember the .NET quality bar:
        - dotnet build --nologo --verbosity quiet  (warnings are evidence, read them)
        - dotnet test  --nologo --verbosity quiet  (a 0-test run is NOT a pass)
        - nullable reference warnings (CS86xx) are real bugs — fix, do not suppress
        - a new project or test project must be added to the .sln
        Do NOT run pytest / go test / npm test.
        Query:
        {{query}}
