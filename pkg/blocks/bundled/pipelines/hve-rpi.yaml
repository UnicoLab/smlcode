api_version: blocks/v1
kind: pipeline
id: hve-rpi
name: HVE RPI Lifecycle (Research · Challenge · Plan · Implement · Review)
description: >-
  Microsoft HVE-Core RPIR workflow: FAR-rubric research with uncertainty tracking,
  adversarial plan challenge, atomic task planning, phase-gated implementation,
  and multi-perspective review.
version: "1.0.0"
author: UnicoLab
license: MIT
language: any
tags: [hve, rpi, rpir, research, challenge, pipeline]
icon: "🚀"
shareable: true
spec:
  version: 1
  order:
    - init
    - skills
    - context
    - explore
    - docs
    - clarify
    - architect
    - plan
    - split
    - coord
    - execute
    - learn
    - polish
    - test
    - memory
    - done
  groups:
    - id: prepare
      label: Research (FAR)
      steps: [init, skills, context, explore, docs]
    - id: design
      label: Clarify & Plan
      steps: [clarify, architect, plan, split]
    - id: build
      label: Implement
      steps: [coord, execute, learn]
    - id: verify
      label: Review & Verify
      steps: [polish, test]
    - id: finish
      label: Finish
      steps: [memory, done]
  phases:
    init: {agent: "", when: always, label: Init, tip: Boot workspace + session, group: prepare}
    skills: {agent: "", when: always, label: Skills, tip: Load HVE RPI & domain skills, group: prepare}
    context: {agent: context, when: always, label: Context, tip: Refresh CONTEXT / project memory, group: prepare}
    explore: {agent: task-researcher-explorer, when: always, label: Research, tip: HVE FAR-rubric codebase research, group: prepare}
    docs: {agent: docs, when: auto, label: Docs, tip: Inspect docs & architecture conventions, group: prepare}
    clarify: {agent: "", when: auto, label: Clarify, tip: Lock scope, UX states & architecture decisions, group: design}
    architect: {agent: ux-architect, when: auto, label: Architect, tip: Shape UX & component architecture, group: design}
    plan: {agent: task-planner, when: always, label: Plan, tip: HVE dependency-ordered implementation plan, group: design}
    split: {agent: splitter, when: always, label: Split, tip: Break into atomic SLM tasks, group: design}
    coord: {agent: coordinator, when: always, label: Coord, tip: Coordinate board & focus, group: build}
    execute: {agent: task-implementer-worker, when: always, label: Implement, tip: Phase-gated HVE implementation + review, group: build}
    learn: {agent: memory, when: auto, label: Learn, tip: Capture lessons mid-run, group: build}
    polish: {agent: placeholder, when: always, label: Polish, tip: Fill placeholders / flag gaps, group: verify}
    test: {agent: tester, when: always, label: Verify, tip: Run project build, lint & test gates, group: verify}
    memory: {agent: memory, when: always, label: Memory, tip: Distill long-term memory, group: finish}
    done: {agent: "", when: always, label: Done, tip: Run complete, group: finish}
  execute:
    default_role: task-implementer-worker
    reviewer: task-reviewer
    corrector: corrector
    max_waves: 3
  slots:
    - id: hve-rpi-challenge
      agent: rpi-challenger-reviewer
      title: HVE RPI Adversarial Challenge
      before: plan
      when: always
      persist_to: context
      fail_mode: continue
      input: |
        Challenge the research findings and highlight any unverified assumptions,
        edge cases, or scope hazards before planning:
        {{query}}
    - id: hve-plan-validation
      agent: plan-validator-reviewer
      title: HVE Plan Validation Gate
      after: plan
      when: always
      persist_to: scratch
      fail_mode: continue
      input: |
        Validate that the execution plan covers all locked PRD goals, UX states,
        and verifiable acceptance criteria for:
        {{query}}
