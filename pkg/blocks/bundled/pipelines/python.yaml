api_version: blocks/v1
kind: pipeline
id: python
name: Python Engineering Pipeline
description: >-
  Full SLMCode graph tuned for Python packages — ruff/pytest-aware tester,
  packaging-aware paths (src/, tests/, pyproject), and execute-loop defaults.
version: "1.0.0"
author: UnicoLab
license: MIT
language: python
tags: [python, pytest, ruff, pipeline]
icon: "🐍"
shareable: true
spec:
  version: 1
  order:
    - init
    - skills
    - context
    - explore
    - docs
    - architect
    - clarify
    - plan
    - split
    - coord
    - execute
    - learn
    - polish
    - test
    - memory
    - done
  groups:
    - id: prepare
      label: Prepare
      steps: [init, skills, context, explore, docs]
    - id: design
      label: Design
      steps: [architect, clarify, plan, split]
    - id: build
      label: Build
      steps: [coord, execute, learn]
    - id: verify
      label: Verify
      steps: [polish, test]
    - id: finish
      label: Finish
      steps: [memory, done]
  phases:
    init: {agent: "", when: always, label: Init, tip: Boot workspace + session, group: prepare}
    skills: {agent: "", when: always, label: Skills, tip: Load skills & knowledge packs, group: prepare}
    context: {agent: context, when: always, label: Context, tip: Refresh CONTEXT / project memory, group: prepare}
    explore: {agent: explorer, when: auto, label: Explore, tip: Discover Python packages & tests, group: prepare}
    docs: {agent: docs, when: auto, label: Docs, tip: Read README/docs & packaging layout, group: prepare}
    architect: {agent: architect, when: auto, label: Architect, tip: Shape modules & APIs, group: design}
    clarify: {agent: "", when: auto, label: Clarify, tip: Lock PRD / ask decisions, group: design}
    plan: {agent: planner, when: always, label: Plan, tip: Write the execution plan, group: design}
    split: {agent: splitter, when: always, label: Split, tip: Break into atomic tasks, group: design}
    coord: {agent: coordinator, when: always, label: Coord, tip: Coordinate board & focus, group: build}
    execute: {agent: worker, when: always, label: Execute, tip: Workers implement + review, group: build}
    learn: {agent: memory, when: auto, label: Learn, tip: Capture lessons mid-run, group: build}
    polish: {agent: placeholder, when: always, label: Polish, tip: Fill placeholders / flag gaps, group: verify}
    test: {agent: python-tester, when: always, label: Test, tip: Ruff + pytest verification, group: verify}
    memory: {agent: memory, when: always, label: Memory, tip: Distill long-term memory, group: finish}
    done: {agent: "", when: always, label: Done, tip: Run complete, group: finish}
  execute:
    default_role: python-worker
    reviewer: reviewer
    corrector: corrector
    max_waves: 2
  slots:
    - id: python-quality-gate
      agent: python-tester
      title: Python quality reminder
      before: execute
      when: always
      persist_to: scratch
      fail_mode: continue
      input: |
        Before implementing, remember Python quality bar:
        - ruff format / ruff check when available
        - typecheck (mypy/pyright) when configured
        - python -m pytest -q (or uv run pytest -q)
        - never treat compileall alone as success for greenfield apps
        Query:
        {{query}}
