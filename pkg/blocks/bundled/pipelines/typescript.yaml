api_version: blocks/v1
kind: pipeline
id: typescript
name: TypeScript / Node Engineering Pipeline
description: >-
  SLMCode pipeline tuned for Node and TypeScript services, libraries and
  CLIs — tsc --noEmit, eslint and vitest/jest gates with a TS-aware worker,
  tester and reviewer.
version: "1.0.0"
author: UnicoLab
license: MIT
language: typescript
tags: [typescript, node, tsc, pipeline]
icon: "🟦"
shareable: true
spec:
  version: 1
  order:
    - init
    - skills
    - context
    - explore
    - docs
    - architect
    - clarify
    - plan
    - split
    - coord
    - execute
    - learn
    - polish
    - test
    - memory
    - done
  groups:
    - id: prepare
      label: Prepare
      steps: [init, skills, context, explore, docs]
    - id: design
      label: Design
      steps: [architect, clarify, plan, split]
    - id: build
      label: Build
      steps: [coord, execute, learn]
    - id: verify
      label: Verify
      steps: [polish, test]
    - id: finish
      label: Finish
      steps: [memory, done]
  phases:
    init: {agent: "", when: always, label: Init, tip: Boot workspace + session, group: prepare}
    skills: {agent: "", when: always, label: Skills, tip: Load skills & knowledge packs, group: prepare}
    context: {agent: context, when: always, label: Context, tip: Refresh CONTEXT / project memory, group: prepare}
    explore: {agent: explorer, when: auto, label: Explore, tip: Map modules, exports & tsconfig paths, group: prepare}
    docs: {agent: docs, when: auto, label: Docs, tip: Read README, package.json scripts & tsconfig, group: prepare}
    architect: {agent: architect, when: auto, label: Architect, tip: Shape module boundaries & public types, group: design}
    clarify: {agent: "", when: auto, label: Clarify, tip: Lock PRD / ask decisions, group: design}
    plan: {agent: planner, when: always, label: Plan, tip: Write the execution plan, group: design}
    split: {agent: splitter, when: always, label: Split, tip: Break into atomic tasks, group: design}
    coord: {agent: coordinator, when: always, label: Coord, tip: Coordinate board & focus, group: build}
    execute: {agent: ts-worker, when: always, label: Execute, tip: Workers implement + review, group: build}
    learn: {agent: memory, when: auto, label: Learn, tip: Capture lessons mid-run, group: build}
    polish: {agent: placeholder, when: always, label: Polish, tip: Fill placeholders / flag gaps, group: verify}
    test: {agent: ts-tester, when: always, label: Test, tip: tsc --noEmit + lint + tests, group: verify}
    memory: {agent: memory, when: always, label: Memory, tip: Distill long-term memory, group: finish}
    done: {agent: "", when: always, label: Done, tip: Run complete, group: finish}
  execute:
    default_role: ts-worker
    reviewer: ts-reviewer
    corrector: corrector
    max_waves: 2
  slots:
    - id: typescript-quality-gate
      agent: ts-tester
      title: TypeScript / Node quality reminder
      before: execute
      when: always
      persist_to: scratch
      fail_mode: continue
      input: |
        Before implementing, remember the TypeScript quality bar:
        - npx tsc --noEmit must pass — no `any`, no `as unknown as`, no @ts-ignore
        - every value that can be null/undefined is narrowed before use
        - npm run lint --if-present
        - npm test --silent (vitest or jest — read package.json scripts)
        Do NOT run pytest / go test / cargo test.
        Query:
        {{query}}
