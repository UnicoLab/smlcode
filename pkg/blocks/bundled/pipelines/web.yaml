api_version: blocks/v1
kind: pipeline
id: web
name: Static Web Engineering Pipeline
description: >-
  SLMCode pipeline tuned for static browser deliverables (vanilla HTML/CSS/JS)
  — emphasizes a usable HTML entrypoint, asset integrity, and a browser-oriented
  tester that never invokes pytest/go test/npm test without a package.json.
version: "1.0.0"
author: UnicoLab
license: MIT
language: html
tags: [web, html, css, javascript, static, pipeline]
icon: "🌐"
shareable: true
spec:
  version: 1
  order:
    - init
    - skills
    - context
    - explore
    - docs
    - architect
    - clarify
    - plan
    - split
    - coord
    - execute
    - learn
    - polish
    - test
    - memory
    - done
  groups:
    - id: prepare
      label: Prepare
      steps: [init, skills, context, explore, docs]
    - id: design
      label: Design
      steps: [architect, clarify, plan, split]
    - id: build
      label: Build
      steps: [coord, execute, learn]
    - id: verify
      label: Verify
      steps: [polish, test]
    - id: finish
      label: Finish
      steps: [memory, done]
  phases:
    init: {agent: "", when: always, label: Init, tip: Boot workspace + session, group: prepare}
    skills: {agent: "", when: always, label: Skills, tip: Load skills & knowledge packs, group: prepare}
    context: {agent: context, when: always, label: Context, tip: Refresh CONTEXT / project memory, group: prepare}
    explore: {agent: explorer, when: auto, label: Explore, tip: Discover existing HTML/CSS/JS, group: prepare}
    docs: {agent: docs, when: auto, label: Docs, tip: Read README & asset conventions, group: prepare}
    architect: {agent: architect, when: auto, label: Architect, tip: Shape page structure & script flow, group: design}
    clarify: {agent: "", when: auto, label: Clarify, tip: Lock PRD / ask decisions, group: design}
    plan: {agent: planner, when: always, label: Plan, tip: Write the execution plan, group: design}
    split: {agent: splitter, when: always, label: Split, tip: Break into atomic tasks incl. HTML entrypoint, group: design}
    coord: {agent: coordinator, when: always, label: Coord, tip: Coordinate board & focus, group: build}
    execute: {agent: web-worker, when: always, label: Execute, tip: Workers implement + review, group: build}
    learn: {agent: memory, when: auto, label: Learn, tip: Capture lessons mid-run, group: build}
    polish: {agent: placeholder, when: always, label: Polish, tip: Fill placeholders / flag gaps, group: verify}
    test: {agent: web-tester, when: always, label: Test, tip: Verify HTML entrypoint + asset integrity, group: verify}
    memory: {agent: memory, when: always, label: Memory, tip: Distill long-term memory, group: finish}
    done: {agent: "", when: always, label: Done, tip: Run complete, group: finish}
  execute:
    default_role: web-worker
    reviewer: reviewer
    corrector: corrector
    max_waves: 2
  slots:
    - id: web-deliverable-gate
      agent: web-worker
      title: Static web deliverable reminder
      before: execute
      when: always
      persist_to: scratch
      fail_mode: continue
      input: |
        Before implementing, remember the static-web deliverable bar:
        - At least one usable .html entrypoint (index.html unless specified).
        - Small file set: index.html + style.css + script.js (or self-contained).
        - Every asset reference in HTML resolves to a written file.
        - No build step / bundler / framework unless explicitly requested.
        - No pytest / go test / npm test unless package.json exists.
        Query:
        {{query}}
