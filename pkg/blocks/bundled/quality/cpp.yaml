api_version: blocks/v1
kind: quality
id: cpp
name: C/C++ Quality Pack
description: >-
  C/C++ verify pack — CMake/Make build + test (CTest), no pytest/go/npm leakage.
version: "1.1.0"
author: UnicoLab
license: MIT
language: cpp
tags: [c, cpp, cmake, make, ctest, test]
icon: "⚙️"
shareable: true
spec:
  detect:
    # A bare Makefile is NOT evidence of C/C++ — Go, Python and Node repos all
    # ship one. Only real C/C++ build descriptions count as markers; a
    # Makefile-only project is still detected through its .c/.cpp sources.
    files: [CMakeLists.txt, meson.build, configure.ac, CMakePresets.json, conanfile.txt]
    extensions: [.c, .cpp, .cc, .cxx, .h, .hpp, .hh]
    priority: 14
  build:
    # `cmake --build <dir>` is the canonical way to build a CMake project and is
    # allowed, exactly like `go build` or `cargo build`: it runs the project's
    # OWN build, which is the documented-inherent risk of a coding harness.
    # What stays refused is `cmake -P` / `-C` (run a CMake script), `cmake -E`
    # (file mutator) and any operand pointing outside the workspace.
    - cmd: cmake --build build
      label: cmake build
      optional: true
  test:
    - cmd: ctest --test-dir build --output-on-failure
      label: ctest
  smoke: cmake --build build
  qa_gate: ctest --test-dir build --output-on-failure
  safe_prefixes:
    # `make` is deliberately absent: it runs whatever a Makefile recipe says,
    # which is indistinguishable from an arbitrary shell. Applying a language
    # pack must not silently hand that back.
    - cmake --build
    - cmake -S
    - cmake --version
    - ctest
    - ninja
    - gcc
    - g++
    - clang
    - clang++
  tester_hints: |
    Configure once:  cmake -S . -B build -G Ninja
    Build:           cmake --build build      (or: ninja -C build)
    Test:            ctest --test-dir build --output-on-failure
    Syntax-only:     g++ -fsyntax-only -std=c++20 <file>

    Build directories must be relative and inside the project (`build`, not
    `/tmp/build` or `../build`). This harness refuses `make` (it runs whatever a
    Makefile recipe says, which is indistinguishable from an arbitrary shell)
    and refuses `cmake -P` / `cmake -C` (run a CMake script) and `cmake -E`
    (file mutator — use ws_write/ws_edit/ws_mv). Never report a skipped build
    as a pass.

    C/C++ facts that decide pass/fail:
    - Adding a .cpp file to the tree does not add it to the build. It must be
      listed in add_executable/add_library (or picked up by an existing GLOB
      followed by a re-run of cmake) or it is never compiled.
    - A new test needs both add_executable and add_test, plus
      enable_testing()/include(CTest), before ctest can ever see it.
    - A build that only re-links stale objects hides a compile error: after
      changing CMakeLists.txt, re-run the configure step, not just the build.
    Do NOT run pytest / go test / npm test.
