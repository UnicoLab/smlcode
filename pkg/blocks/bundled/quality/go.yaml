api_version: blocks/v1
kind: quality
id: go
name: Go Quality Pack
description: >-
  Production Go verify pack — gofmt/goimports, go vet, optional golangci-lint,
  go test -race, and go build. Optimized for modules with go.mod.
version: "1.1.0"
author: UnicoLab
license: MIT
language: go
tags: [go, golang, lint, test, race, fmt]
icon: "🐹"
shareable: true
spec:
  detect:
    files: [go.mod]
    extensions: [.go]
    priority: 20
  format:
    - cmd: gofmt -l .
      label: gofmt
    - cmd: goimports -l .
      label: goimports
      optional: true
  lint:
    - cmd: go vet ./...
      label: go vet
    - cmd: golangci-lint run
      label: golangci-lint
      optional: true
  test:
    - cmd: go test ./... -race -count=1
      label: go test -race
  build:
    - cmd: go build ./...
      label: go build
  smoke: go test ./... -short
  qa_gate: go test ./... -race -count=1
  safe_prefixes:
    - go test
    - go vet
    - gofmt
    - goimports
    - golangci-lint
    - go build
    - go mod
  tester_hints: |
    Prefer: go test ./... -race -count=1
    Fast smoke: go test ./... -short
    Always run go vet ./... before claiming pass.
    Optional: golangci-lint run when available.
    Fallback: if -race is unsupported on this platform, `go test ./... -count=1`.

    Go-specific failures a small model produces, and how to see them:
    - `go test ./pkg/x` on a package with NO test files exits 0 and prints
      "no test files". That is not a pass for a task that asked for tests.
    - gofmt -l prints the DIRTY files and exits 0. Empty output is the pass
      condition; a non-empty list is a failure even though the exit code is 0.
    - go vet catches printf arity, lost struct tags, and unused results that
      compile fine. Never skip it because the build succeeded.
    - -race only reports a data race it actually observes; a single-goroutine
      test proves nothing about concurrency.
