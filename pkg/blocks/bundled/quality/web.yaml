api_version: blocks/v1
kind: quality
id: web
name: Static Web (HTML/CSS/JS) Quality Pack
description: >-
  Verify pack for static browser projects (vanilla HTML/CSS/JS, no build step).
  Gates on a usable, non-empty HTML entrypoint rather than a test runner — so a
  plain "build an HTML game" request never gets pytest or npm test forced on it.
version: "1.1.0"
author: UnicoLab
license: MIT
language: html
tags: [web, html, css, javascript, static, vanilla, pack]
icon: "🌐"
shareable: true
spec:
  detect:
    files: [index.html, index.htm]
    extensions: [.html, .htm, .css]
    priority: 18
  test:
    # `test -s` is the whole gate: exists AND is non-empty. The previous gate
    # used $(find …), which the shell layer now refuses outright (command
    # substitution hides a nested command from every guard) — a gate the
    # harness refuses to run is strictly worse than no gate.
    - cmd: test -s index.html || test -s index.htm
      label: html-entrypoint-present
  smoke: test -s index.html || test -s index.htm
  qa_gate: test -s index.html || test -s index.htm
  safe_prefixes:
    - node --check
    - test -s
    - test -f
  tester_hints: |
    Static browser project — no bundler, no test runner.
    Verify, in this order:
    1) index.html exists at the project root and is non-empty (`test -s index.html`).
       Some other .html entrypoint is acceptable only if index.html links to it.
    2) Every <script src> and <link rel="stylesheet"> path resolves on disk
       (ws_read the referenced file — a 404 asset is a broken page).
    3) `node --check <file>.js` on each classic script. SKIP this for modules:
       node --check reports a false failure on `import`/`export` in a plain .js
       file, so only run it on files the page loads WITHOUT type="module".
    Do NOT run pytest / go test / npm test unless a package.json exists.
