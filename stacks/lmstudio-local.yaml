# ── SLMCode Stack: LM Studio ──
# LM Studio serves an OpenAI-compatible API on :1234 once "Local Server" is
# started (or `lms server start` from the CLI).
#
# IMPORTANT: `model` must be the identifier LM Studio itself shows for the
# loaded model — copy it from the server tab or `lms ps`. The value below is the
# usual id for Qwen2.5-Coder 14B; change it to match what you actually loaded,
# and set the loaded model's context length in LM Studio to at least the
# context_limit below or the server truncates the prompt without saying so.
#
# Apply: slmcode stack apply lmstudio-local

label: LM Studio
description: Local OpenAI-compatible server on :1234
icon: "🖥️"

provider: lmstudio
endpoint: http://127.0.0.1:1234/v1
model: qwen2.5-coder-14b-instruct
backend: slmcode
temperature: 0.1
max_tokens: 3072
max_parallel: 1
max_retries: 4
max_context_kb: 32
think_passes: 1
task_timeout_sec: 900
dynamic_pipeline: true
pinned_skills:
  - atomic-coding

# max_parallel is 1 on purpose: LM Studio serves one model instance, so parallel
# specialists queue behind each other and only add latency and timeout risk.
model_profiles:
  default:
    context_limit: 32768
    max_tokens: 3072
    thinking_budget_tokens: 2048
    skill_token_budget: 300
    knowledge_token_budget: 220
    temperature: 0.1
    max_turns: 22

qa_gate: true
qa_gate_max_rounds: 3
post_worker_smoke: true
scope_judge: true
placeholder_pass: true
quality_monitor: true
static_quality: true
thinking_budget: true
thinking_budget_tokens: 2048
worker_critique: true
require_smoke: true
claims_gate: true
over_edit_guard: true
finalize_warn: true
auto_text_tools: true

write_guard: true
read_before_edit: true
shell_write_guard: true
tool_guidance: true
knowledge_inject: true
context_compact: true
react_compact: true
react_compact_at_percent: 80
wave_snapshots: true
file_checkpoints: true
hooks_enabled: true
read_head_lines: 80

clarify_mode: auto
plan_approve: auto
escalate_ask: ask
continue_ask: ask
auto_approve: false
shell_permission: allow
shell_whitelist: true

price_preset: local
