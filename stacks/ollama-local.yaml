# ── SLMCode Stack: Ollama Local ──
# Any local model served by Ollama.
# Apply: slmcode stack apply ollama-local
# Or: make stack-apply stack=ollama-local

label: Ollama Local
description: Run models locally via Ollama
icon: "🦙"

provider: ollama
endpoint: http://127.0.0.1:11434
model: qwen2.5-coder:7b
backend: slmcode
temperature: 0.1
max_tokens: 2048
max_parallel: 2
max_retries: 4
max_context_kb: 32
think_passes: 1
task_timeout_sec: 720
dynamic_pipeline: true
pinned_skills:
  - atomic-coding

# Local Ollama profile
model_profiles:
  default:
    context_limit: 32768
    max_tokens: 2048
    thinking_budget_tokens: 2048
    skill_token_budget: 220
    knowledge_token_budget: 160
    temperature: 0.1
    max_turns: 20

# Quality gates
qa_gate: true
qa_gate_max_rounds: 3
post_worker_smoke: true
scope_judge: true
placeholder_pass: true
quality_monitor: true
static_quality: true
thinking_budget: true
thinking_budget_tokens: 2048
worker_critique: true
require_smoke: true
claims_gate: true
over_edit_guard: true
finalize_warn: true
auto_text_tools: true

# Harness invariants
write_guard: true
read_before_edit: true
shell_write_guard: true
tool_guidance: true
knowledge_inject: true
context_compact: true
react_compact: true
react_compact_at_percent: 80
wave_snapshots: true
file_checkpoints: true
hooks_enabled: true
read_head_lines: 80

# Interactions
clarify_mode: auto
plan_approve: auto
escalate_ask: ask
continue_ask: ask
auto_approve: false
shell_permission: allow
shell_whitelist: true

# Local = free
price_preset: local
