# ── SLMCode Stack: vLLM ──
# vLLM's OpenAI-compatible server. `model` must be EXACTLY the string passed to
# --model (or --served-model-name); vLLM rejects anything else with a 404.
#
#   vllm serve Qwen/Qwen2.5-Coder-32B-Instruct \
#     --max-model-len 32768 --port 8000
#
# Keep context_limit <= the server's --max-model-len. vLLM errors on an
# over-long prompt rather than truncating, which shows up as a failed run
# rather than as quietly worse output — still worth getting right.
#
# Apply: slmcode stack apply vllm-local

label: vLLM
description: vLLM OpenAI-compatible server — high-throughput local serving
icon: "⚡"

provider: vllm
endpoint: http://127.0.0.1:8000/v1
model: Qwen/Qwen2.5-Coder-32B-Instruct
backend: slmcode
temperature: 0.1
max_tokens: 4096
max_parallel: 4
max_retries: 3
max_context_kb: 32
think_passes: 1
task_timeout_sec: 900
dynamic_pipeline: true
pinned_skills:
  - atomic-coding

# vLLM batches genuinely well, so max_parallel above 1 is real throughput here
# (unlike a single-instance desktop server).
model_profiles:
  default:
    context_limit: 32768
    max_tokens: 4096
    thinking_budget_tokens: 4096
    skill_token_budget: 400
    knowledge_token_budget: 300
    temperature: 0.1
    max_turns: 28

qa_gate: true
qa_gate_max_rounds: 3
post_worker_smoke: true
scope_judge: true
placeholder_pass: true
quality_monitor: true
static_quality: true
thinking_budget: true
thinking_budget_tokens: 4096
worker_critique: true
require_smoke: true
claims_gate: true
over_edit_guard: true
finalize_warn: true
auto_text_tools: true

write_guard: true
read_before_edit: true
shell_write_guard: true
tool_guidance: true
knowledge_inject: true
context_compact: true
react_compact: true
react_compact_at_percent: 80
wave_snapshots: true
file_checkpoints: true
hooks_enabled: true
read_head_lines: 80

clarify_mode: auto
plan_approve: auto
escalate_ask: ask
continue_ask: ask
auto_approve: false
shell_permission: allow
shell_whitelist: true

price_preset: local
