<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SLMCode Studio</title>
    <!-- No webfont CDN. Studio is an offline-first, private, local tool: a
         request to fonts.googleapis.com on every load would leak that the user
         opened it, and would render unstyled (or hang) with no network at all.
         Typography falls back to the platform UI stack; drop woff2 files into
         public/fonts/ to opt back into Inter / JetBrains Mono locally. See
         src/styles/fonts.css. -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='6' fill='%237c3aed'/><text x='16' y='22' font-family='system-ui' font-weight='700' font-size='18' fill='white' text-anchor='middle'>SL</text></svg>" />
  </head>
  <body class="antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
